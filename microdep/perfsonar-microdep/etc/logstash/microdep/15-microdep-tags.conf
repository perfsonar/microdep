filter {
    if [event_type] {
       # Add some tags based on event types
       if 'gap-ana' not in [tags] {
       	   # Check if current dataset is still gap-ana data
	   if [event_type] =~ /gapsum|gap/ or [event_type] == "topology" and [test] =~ /latency|latencybg/ {
	      	add_tag => ["gap-ana"]
	   }
       }
       if 'trace-ana' not in [tags] {
       	   # Check if current dataset is still trace-ana data
	   if [event_type] =~ /routesum|routerr|routechange/ or [event_type] == "topology" and [test] == "trace" {
	      	add_tag => ["trace-ana"]
	   }
       }
    }
}