#
# Map config for Dragonlab
#
#  (see mapconfig.yaml for more comments)
#

dragonlab:
  # Measuremet network/variant parameters
  title: "Net-4"
  descr: "Measurement network applying ipv4 test traffic"
  database_path: "/var/lib/perfsonar/microdep/dragonlab.db"
  database_secret: "virre-virre-vapp"
  ip_version: "4"
  event_type:
    # Event types for variant
    gap:
      index: "dragonlab"
    jitter:
      index: "dragonlab_jitter" 
      topology_index: "dragonlab" 
    routeerr:
      index: "dragonlab_routemon" 
    routechange:
      index: "dragonlab_routemon" 
    tcprouteerr:
      index: "dragonlab_routemon" 
    tcproutechange:
      index: "dragonlab_routemon" 
    correlation:
      index: "dragonlab_correvents"
      topology_index: "dragonlab" 

