<VirtualHost *:80>
  <IfModule rewrite_module>
    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/microdep.* https://%{SERVER_NAME}%{REQUEST_URI} [R,L]
  </IfModule>
</VirtualHost>

Alias /microdep/elastic-get-date-type.pl /usr/lib/perfsonar/bin/microdep_commands/elastic-get-date-type.pl
Alias /microdep/get-mapconfig.cgi /usr/lib/perfsonar/bin/microdep_commands/get-mapconfig.cgi
Alias /microdep/get-tracetests.pl /usr/lib/perfsonar/bin/microdep_commands/get-tracetests.pl
Alias /microdep/hopgeo.pl /usr/lib/perfsonar/bin/microdep_commands/hopgeo.pl
<Directory "/usr/lib/perfsonar/bin/microdep_commands/">
    Options +ExecCGI
    AddHandler cgi-script .pl .cgi
    AllowOverride None
    <IfVersion >= 2.4>
        Require all granted
    </IfVersion>
    <IfVersion < 2.4>
        Order allow,deny
        Allow from all
    </IfVersion>
</Directory>
Alias /microdep /usr/lib/perfsonar/microdep-map
<Directory "/usr/lib/perfsonar/microdep-map">
    Options +FollowSymLinks +MultiViews
    AllowOverride None
    <IfVersion >= 2.4>
        Require all granted
    </IfVersion>
    <IfVersion < 2.4>
        Order allow,deny
        Allow from all
    </IfVersion>
    # Not to be shown inside pages of other sites (clickjacking). The map shows
    # pages of its own in frames, so its own site is allowed.
    Header set X-Frame-Options "SAMEORIGIN"
    Header set X-Content-Type-Options "nosniff"
    # What the pages may load and run: scripts from this site only, and none
    # written into a page; map tiles from OpenStreetMap; all else from this site.
    # A site that shows other map tiles has to name their source under img-src.
    Header set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    # Cache-busting: always revalidate the app's HTML/JS/CSS so a deployed
    # change takes effect on a normal reload (server answers 304 when the file
    # is unchanged, so it's cheap). Fonts/images keep their default caching.
    <FilesMatch "\.(html|js|css)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</Directory>

