# OpenSearch datasource for the Microdep `mirodep_gap_ana` index (the dense
# "Queues"/jitter event). 
# Time field is @timestamp (date); h_jit / h_ddelay / h_min_d are floats (ms).
#
# Provision to: /usr/lib/perfsonar/grafana/provisioning/datasources/
apiVersion: 1

deleteDatasources:
  - name: Microdep jitter
    orgId: 1

datasources:
  - name: Microdep jitter
    type: grafana-opensearch-datasource
    access: proxy
    orgId: 1
    uid: microdep-jitter
    url: https://localhost/opensearch
    basicAuth: false
    isDefault: false
    jsonData:
      database: "microdep_gap_ana"
      flavor: "opensearch"
      version: "2.6.0"
      timeField: "@timestamp"
      maxConcurrentShardRequests: 5
      pplEnabled: true
      tlsAuth: false
      tlsSkipVerify: true
