# OpenSearch datasource for the Microdep `microdep_gap_ana` index (Net-4).
#
# Mirrors perfSONAR's own perfsonar-local.yaml, but points at the microdep_gap_ana
# index instead of pscheduler*, and uses @timestamp as the time field.
#   - @timestamp : date           <- use this
#   - timestamp  : float (epoch)  <- NOT a date type, unusable as time field
#   - datetime   : text           <- NOT a date type
#
# Provision by copying to:
#   /usr/lib/perfsonar/grafana/provisioning/datasources/
# (that path is grafana.ini's `provisioning` dir on a perfSONAR host).
apiVersion: 1

deleteDatasources:
  - name: Microdep gap ana
    orgId: 1

datasources:
  - name: Microdep gap ana
    type: grafana-opensearch-datasource
    access: proxy
    orgId: 1
    uid: microdep-gap-ana
    url: https://localhost/opensearch
    basicAuth: false
    isDefault: false
    jsonData:
      database: "microdep_gap_ana"
      flavor: "opensearch"
      version: "2.6.0"
      timeField: "@timestamp"
      maxConcurrentShardRequests: 5
      pplEnabled: true
      tlsAuth: false
      tlsSkipVerify: true
