filter {
    # Fix issue with logstash-added hostname
    if [host] and ! [host][name] { mutate { rename => { "[host]" => "[host][name]" } } }

    # Drop the request headers that the http input adds to a record: they are
    # not part of the measurement. (perfSONAR's own pipeline drops them too.)
    if [headers] { mutate { remove_field => [ "headers" ] } }

    # Add field for aggregation
    if [from] and [to] { mutate { add_field => { "[from_to]" => "%{[from]}_%{[to]}" } } }
}