<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>

  <link rel="shortcut icon" href="img/favicon.ico"/>
  
  <script type="text/javascript" src="js/jquery.min.js"></script> 
  <link rel="stylesheet" type="text/css" href="js/datatables.min.css"/>
  <script type="text/javascript" language="javascript" src="js/datatables.min.js"></script>
 
  <script src="js/d3.v4.js"></script>
    
  <title>Micro dependability measurement node map</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="author" href="mailto:microdep@sikt.no">

  <link rel="stylesheet" href="css/jquery-ui.min.css">
  <script src="js/jquery-ui.min.js"></script>

  <link rel="stylesheet" href="css/leaflet.css" />
  <script src="js/leaflet.js"></script>
  <script src="js/leaflet.markercluster-src.js"></script>
  <link rel="stylesheet" href="css/MarkerCluster.css">
  <link rel="stylesheet" href="css/MarkerCluster.Default.css">

  <link rel="stylesheet" href="css/leaflet.contextmenu.min.css">
  <script src="js/leaflet.contextmenu.min.js"></script>
  <script src="js/leaflet.curve.js"></script>
  <script src="js/L.LatLng.UTM.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/sorttable.js"></script>

  <link rel="stylesheet" href="css/microdep-map.css" />

</head>

<body>

  <!-- ===== App Shell ===== -->
  <div class="app-layout">

    <!-- ── Sidebar ── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg class="logo-svg" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8">
            <polygon points="14,2 26,8 26,20 14,26 2,20 2,8" />
            <circle cx="14" cy="14" r="5" />
            <line x1="14" y1="9" x2="14" y2="2" />
            <line x1="18.3" y1="11.5" x2="26" y2="8" />
            <line x1="18.3" y1="16.5" x2="26" y2="20" />
            <line x1="14" y1="19" x2="14" y2="26" />
            <line x1="9.7" y1="16.5" x2="2" y2="20" />
            <line x1="9.7" y1="11.5" x2="2" y2="8" />
          </svg>
          <div class="logo-text">
            <strong>Micro Dep</strong>
            <span>G&Eacute;ANT Network Monitor</span>
          </div>
        </div>
        <button class="sidebar-toggle-btn" id="sidebarToggle" title="Toggle sidebar" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-body">
        <div class="filter-group">
          <label class="filter-label">Network</label>
          <div class="select-wrap">
            <select id="network" class="knapp" title="Measurement network">
              <option value="none">None</option>
            </select>
          </div>
        </div>

        <div class="filter-group">
          <label class="filter-label">Event Type</label>
          <div class="select-wrap">
            <select id="event_type" title="Measurement type">
              <option value="none">None</option>
            </select>
          </div>
        </div>

        <div class="filter-group">
          <label class="filter-label">Property</label>
          <div class="select-wrap">
            <select id="prop_select" class="knapp" title="Measurement variable"></select>
          </div>
        </div>

        <div class="filter-group">
          <label class="filter-label">Percentile</label>
          <div class="select-wrap">
            <select id="stats_type" class="knapp" title="Percent observations bigger than value">
              <option value="99.0">99%</option>
              <option value="95.0">95%</option>
              <option value="50.0">50%</option>
              <option value="1.0">1%</option>
            </select>
          </div>
        </div>

        <div class="filter-group">
          <label class="filter-label">Period</label>
          <div class="select-wrap">
            <select class="knapp" id="period" title="Measurement period">
              <option value="1">Hour</option>
              <option value="24" selected="selected">Day</option>
              <option value="168">Week</option>
              <option value="672">4 weeks</option>
            </select>
          </div>
        </div>

        <div class="filter-group">
          <label class="filter-label">Date &amp; Time</label>
          <div class="date-row">
            <input class="knapp" type="text" id="datepicker" size="12em" title="Measurement start">
            <input class="knapp" type="text" id="period_input" size="4em" placeholder="00:00" title="Starting hour">
          </div>
          <div class="nav-row">
            <button class="knapp nav-btn" id="prev" title="Previous period" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
              Prev
            </button>
            <button class="knapp nav-btn" id="next" title="Next period" type="button">
              Next
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
        </div>

        <div class="sidebar-divider"></div>

        <div class="filter-group">
          <label class="filter-label">Search</label>
          <input class="knapp search-input" type="search" id="search_input" placeholder="Filter by link name…" title="Type to select by link names">
        </div>

        <span class="knapp" id="refs" style="display:none"></span>

        <div class="filter-group">
          <div class="toggle-row">
            <span class="toggle-label">Auto-refresh</span>
            <button class="knapp" id="live" title="Refresh display every minute" type="button">Autorefresh</button>
          </div>
        </div>

        <div id="busy"></div>
      </div>

      <div class="sidebar-footer">
        <!-- Theme switcher -->
        <div class="theme-switcher" id="themeSwitcher">
          <button class="theme-btn" data-theme="auto" title="Auto (system)" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 3v18"/>
              <path d="M12 3a9 9 0 0 1 0 18"/>
            </svg>
            <span>Auto</span>
          </button>
          <button class="theme-btn" data-theme="light" title="Light mode" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <span>Light</span>
          </button>
          <button class="theme-btn" data-theme="dark" title="Dark mode" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <span>Dark</span>
          </button>
        </div>
        <a class="about-link" href="https://sikt.no/en/micro-dependability" target="microdep-project">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
          </svg>
          About this project
        </a>
      </div>
    </aside>

    <!-- ── Main Area ── -->
    <div class="main-area">

      <main id="tabs">
        <ul>
          <li class="sidebar-open-li" id="sidebarOpenWrap">
            <button class="sidebar-open-btn" id="sidebarOpen" title="Open sidebar" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
              </svg>
            </button>
          </li>
          <li><a href="#mapid">Map</a></li>
          <li>
            <select class="knapp" id="check" title="Reports for current parameter">
              <option value="choose">+</option>
              <option value="heatmap" title="Table of alle variables">Heatmap</option>
              <option value="missing" title="Missing opposite links">Missing</option>
              <option value="asymmetry" title="Asymmetry in selected variable">Asymmetry</option>
              <option value="summary" title="Table of alle variables">Summary</option>
            </select>
          </li>
        </ul>
        <div id="mapid"></div>
      </main>

      <div id="legend"></div>

      <div class="status-bar">
        <div class="status-item">
          <span class="status-label">Status</span>
          <span id="status">none</span>
        </div>
        <div class="status-item">
          <span class="status-label">Error</span>
          <span id="error">none</span>
        </div>
      </div>

    </div><!-- /.main-area -->
  </div><!-- /.app-layout -->

  <span class="knapp" id="missing" style="display:none"></span>

  <!-- ===== Theme & Sidebar JS — must run before microdep-map.js ===== -->
  <script>
  (function(){
    // --- Theme switcher ---
    var root = document.documentElement;
    var saved = localStorage.getItem('microdep-theme') || 'auto';
    root.setAttribute('data-theme', saved);

    function applyTheme(mode) {
      root.setAttribute('data-theme', mode);
      localStorage.setItem('microdep-theme', mode);
      document.querySelectorAll('.theme-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.theme === mode);
      });
    }
    applyTheme(saved);

    document.getElementById('themeSwitcher').addEventListener('click', function(e) {
      var btn = e.target.closest('.theme-btn');
      if (btn) applyTheme(btn.dataset.theme);
    });

    // --- Sidebar toggle ---
    var sb = document.getElementById('sidebar');
    var openWrap = document.getElementById('sidebarOpenWrap');

    function updateOpenBtn() {
      openWrap.style.display = sb.classList.contains('collapsed') ? 'list-item' : 'none';
    }
    updateOpenBtn();

    document.getElementById('sidebarToggle').addEventListener('click', function(){
      sb.classList.add('collapsed');
      updateOpenBtn();
      setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 350);
    });

    document.getElementById('sidebarOpen').addEventListener('click', function(){
      sb.classList.remove('collapsed');
      updateOpenBtn();
      setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 350);
    });

    // --- Mobile hamburger (click on ::before pseudo) ---
    document.querySelector('.main-area').addEventListener('click', function(e){
      if (e.target === this && window.innerWidth <= 800) {
        document.getElementById('sidebar').classList.remove('collapsed');
      }
    });

    // --- Override mapid resize logic ---
    // The original JS does: $(window).on("resize", function(){ $("#mapid").height($(window).height()-250); })
    // In our sidebar layout, #mapid should fill its flex container instead.
    // We override by setting #mapid height to the .main-area height minus tab bar and legend/status.
    $(function(){
      $(window).on("resize.microdep-layout", function(){
        var mainArea = $(".main-area");
        if (mainArea.length) {
          var available = mainArea.height();
          var tabNav = mainArea.find(".ui-tabs-nav").outerHeight(true) || 44;
          var legend  = $("#legend").outerHeight(true) || 0;
          var status  = $(".status-bar").outerHeight(true) || 0;
          var mapH = available - tabNav - legend - status;
          if (mapH < 300) mapH = 300;
          $("#mapid").height(mapH);
        }
      });
    });
  })();
  </script>

  <script src="js/microdep-map.js" type="module"></script>

</body>
</html>
